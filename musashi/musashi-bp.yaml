# Podman kube spec: the musashi relay, but forging.
#
# One node doing both jobs — see block-producer.md § 8 for what that costs.
# Switch over from the relay (the chain DB is shared, so no resync):
#
#   podman kube down musashi-relay.yaml
#   podman kube play musashi-bp.yaml
#
# Needs ./keys populated per block-producer.md §§ 2-3, with `chmod 600 keys/*.skey`.
apiVersion: v1
kind: Pod
metadata:
  name: musashi-bp
  labels:
    app: musashi-bp
spec:
  restartPolicy: always
  containers:
    - name: node
      # KEEP THIS DIGEST IN STEP WITH musashi-relay.yaml. The producer is
      # retired; this is the build required by the live config on 2026-09-30,
      # ready only for a deliberate reactivation after the runbook checks.
      image: ghcr.io/input-output-hk/ouroboros-leios/cardano-node-testnet:prototype-2026w38a@sha256:e9e501692d08f88ba372557a59d0c8189cb29f0416fea4e987dff046cad16227
      # /app/run-node.sh takes no key flags, so the producer replaces it. This
      # repeats what that script does — stage the pinned config into /data and
      # run there, since config.json names its genesis files relatively — and
      # adds the four credentials.
      command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          cp -rf /app/config/. /data/
          find /data -mindepth 1 -maxdepth 1 -type f -exec chmod u+w {} +
          cd /data && mkdir -p db
          exec cardano-node run \
            --config config.json \
            --topology topology.json \
            --database-path db \
            --socket-path node.socket \
            --host-addr 0.0.0.0 \
            --port 3010 \
            --shelley-operational-certificate /keys/opcert.cert \
            --shelley-kes-key /keys/kes.skey \
            --shelley-vrf-key /keys/vrf.skey \
            --shelley-bls-key /keys/bls.skey
      env:
        - name: CARDANO_NODE_SOCKET_PATH
          value: /data/node.socket
        - name: CARDANO_NODE_NETWORK_ID
          value: "164"
      ports:
        - name: n2n
          containerPort: 3010
          hostPort: 3010
          protocol: TCP
        - name: metrics
          containerPort: 12798
          hostPort: 12798
          protocol: TCP
          # Loopback only. This is the one port that must NOT be public: the
          # node's Prometheus endpoint is unauthenticated. Scrape it from the
          # host, or tunnel to it; do not open 12798 in a firewall.
          hostIP: 127.0.0.1
      volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: data
          mountPath: /data
        - name: keys
          mountPath: /keys
          readOnly: true
      securityContext:
        capabilities:
          drop:
            - ALL
  volumes:
    - name: config
      hostPath:
        path: ./config
        type: Directory
    - name: data
      hostPath:
        path: /data/musashi
        type: DirectoryOrCreate
    - name: keys
      hostPath:
        path: ./keys
        type: Directory
