# Podman kube spec: one non-block-producing Leios relay on the musashi
# testnet (network magic 164).
#
#   ./pin-config.sh                        # fetch the live network config
#   podman kube play musashi-relay.yaml    # run from this directory
#   podman kube down musashi-relay.yaml    # stop and remove the pod
#
# See cheatsheet.md. Run from 2026-09-21; superseded on this deployment by
# musashi-bp.yaml, and kept as the starting point for a new node and the
# fallback when debugging a producer.
apiVersion: v1
kind: Pod
metadata:
  name: musashi-relay
  labels:
    app: musashi-relay
spec:
  # Restart the node if it crashes; `podman kube down` still stops it.
  restartPolicy: always
  containers:
    - name: node
      # Weekly release tag, digest-pinned so a re-tag cannot change what runs.
      #
      # MATCH THE WEEK TO THE NETWORK, NOT TO MAIN. The live config named
      # MinNodeVersion 11.1.0.164-prototype-2026w38a on 2026-09-30. The chain
      # retains its 2026-09-07 genesis, but its required weekly build advanced
      # from w36 after this environment's historical producer run. A mismatched
      # prototype can start and later diverge; see cheatsheet.md.
      image: ghcr.io/input-output-hk/ouroboros-leios/cardano-node-testnet:prototype-2026w38a@sha256:e9e501692d08f88ba372557a59d0c8189cb29f0416fea4e987dff046cad16227
      # The image's CMD is /app/run-node.sh: it copies /app/config into /data,
      # then runs `cardano-node run` there. Everything below only adjusts the
      # environment that script reads.
      env:
        - name: WORKING_DIR
          value: /data
        - name: SOURCE_DIR
          value: /app
        - name: HOST_ADDR
          value: 0.0.0.0
        - name: PORT
          value: "3010"
        # For `podman exec ... cardano-cli query ...` inside the container.
        - name: CARDANO_NODE_SOCKET_PATH
          value: /data/node.socket
        - name: CARDANO_NODE_NETWORK_ID
          value: "164"
      ports:
        # Node-to-node. Inbound is not required to sync, but publishing it
        # lets peers dial back and is what a relay is for.
        - name: n2n
          containerPort: 3010
          hostPort: 3010
          protocol: TCP
        # Prometheus. Only reachable if ./pin-config.sh rebound the backend
        # from 127.0.0.1 to 0.0.0.0 (its default; EXPOSE_METRICS=0 disables).
        - name: metrics
          containerPort: 12798
          hostPort: 12798
          protocol: TCP
          # Loopback only. This is the one port that must NOT be public: the
          # node's Prometheus endpoint is unauthenticated. Scrape it from the
          # host, or tunnel to it; do not open 12798 in a firewall.
          hostIP: 127.0.0.1
      volumeMounts:
        # Freshly pinned network config, mounted over the image's stale baked
        # copy. Without this the node follows the wrong chain instance.
        - name: config
          mountPath: /app/config
          readOnly: true
        # Chain DB, LeiosDb, node.socket, node.log.
        - name: data
          mountPath: /data
      securityContext:
        capabilities:
          drop:
            - ALL
  volumes:
    - name: config
      hostPath:
        path: ./config
        type: Directory
    - name: data
      hostPath:
        path: /data/musashi
        type: DirectoryOrCreate

# ---------------------------------------------------------------------------
# Block production: see musashi-bp.yaml — the same pod plus a ./keys volume and
# an explicit `cardano-node run` with --shelley-{operational-certificate,kes-key,
# vrf-key,bls-key}, since /app/run-node.sh takes no key flags. The procedure
# (keys, certificates, deposits, rotations) is in block-producer.md.
#
# Both specs pin the same image digest — bump them together.
# ---------------------------------------------------------------------------
